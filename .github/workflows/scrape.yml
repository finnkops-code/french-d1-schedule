name: Division 1 Schedule Scraper
on:
  schedule:
    - cron: '0 * * * *'    # elk uur
    - cron: '0 22 * * 6'   # zaterdagavond 00:00 FR (na de avondwedstrijden)
    - cron: '0 22 * * 0'   # zondagavond 00:00 FR (na de zondagwedstrijden)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies installeren
        run: pip install curl_cffi playwright
      - name: Playwright browsers cachen
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}
      - name: Chromium installeren
        run: playwright install --with-deps chromium
      - name: Schema scrapen
        run: python scraper.py
      - name: JSON committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          git diff --staged --quiet || git commit -m "Schedule bijgewerkt: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
